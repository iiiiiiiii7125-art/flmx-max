# requirements.lock — e2e 依赖全量锁定（A4-08）。
#
# 此前 CI 以 pip install "./tests/e2e[dev]" 直接安装，pyproject 里
# 全是无界 >= 范围、无 lockfile/哈希——Python 是本仓唯一浮动安装
# 的生态（pnpm 有 frozen-lockfile、Go 有 go.sum、UPX 有 sha256）。
# 本文件由 pip 按 CI 的 Python 3.11 目标解析全集（含传递依赖）：
#   python3 -m pip download "./tests/e2e[dev]" \
#     --python-version 3.11 --only-binary=:all: -d <wheels>
# 再按 wheel 文件名生成 name==version 钉版。直接依赖同时在
# pyproject.toml 里以 == 钉住（两处须同版）；升级依赖时同步重跑
# 上述解析并更新两处。
# CI 安装方式（ci-build.yml e2e-api）：先按本 lock 装全集，再
# pip install --no-deps "./tests/e2e[dev]" 装本包自身。
