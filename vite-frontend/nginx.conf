events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # FIX2-C #2：X-Forwarded-Proto 透传上游值（Caddy 等前置代理终止
    # TLS 时，上游已给出真实的客户端 scheme）；无上游值时才回退本机
    # $scheme。此前各 location 硬写 $scheme 会把上游 https 覆写为
    # http（Caddy→nginx 一跳是明文），后端据此判断「面板实际服务
    # 方式」（如节点安装命令的 addr scheme 归一）时永远只能看到 http。
    map $http_x_forwarded_proto $flmx_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # AUDIT-R1 (SCR-002): 备份恢复经 POST /api/v1/backup/import 上传整个 JSON，
    # 节点/订阅多时易超 1MB。nginx 默认 client_max_body_size 1m 会直接 413，
    # 请求到不了后端。放宽到 50m（面板为自托管内网服务）。
    client_max_body_size 50m;

    # gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # F-5 / A8-03: 安全响应头基线（此前全仓无任何安全头，面板可被任意
        # 站点 iframe 嵌入）。注意 nginx 的 add_header 继承规则：某个
        # location 一旦有自己的 add_header，server 级的就全部不继承——
        # 下面带 add_header 的三个 location（PWA/静态/HTML）已各自重复
        # 同一组安全头，新增带 add_header 的 location 时必须同样补齐。
        # CSP 只先落地低风险指令（防嵌入/防对象注入/限定 base），
        # script/style/connect 的完整收紧需真机灰度后再加。
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        # PWA 和 Service Worker 不缓存
        # （本 location 有自己的 add_header，server 级安全头不继承，须重复）
        location ~* (sw\.js|service-worker\.js|workbox-.*\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
            try_files $uri =404;
        }

        # 静态文件缓存（同上，安全头重复）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        }

        # HTML 文件不缓存（同上，安全头重复）
        location ~* \.(?:htm|html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
            try_files $uri $uri/ /index.html;
        }

        # Vue Router的history模式支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API代理到后端
        location = /api/v1/tunnel/diagnose/stream {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/tunnel/diagnose/stream;
        }

        location = /api/v1/forward/diagnose/stream {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/forward/diagnose/stream;
        }

        # sub_store 弃用窗口：GET 凭据在 URL 中，关闭该路径的 access_log
        #（R5-B2 D1；Sunset: Sun, 17 Jan 2027 00:00:00 GMT）
        # R4-N3：凭据 location（本块及下方 sub/、flow/upload、flow/config、
        # /system-info 共五处）另把本块 error_log 降到 crit——全局 warn 级
        # error_log 在上游故障时会记录含 ?secret= 的完整请求行，access_log
        # off 堵不住。上游类消息为 error 级、crit 只保留 crit/alert/emerg
        #（不含请求行）；独立 error 文件方案不成立（密钥仍明文落盘）。
        location = /api/v1/open_api/sub_store {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/open_api/sub_store;
        }

        # 订阅拉取：token 在路径中（/open_api/sub/{token}），关闭 access_log
        #（A8-01；与 sub_store 先例同口径）。须置于 ^~ /api/v1/ 之前以更长前缀胜出。
        location ^~ /api/v1/open_api/sub/ {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/open_api/sub/;
        }

        location ^~ /api/v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/;
        }

        # 流量与配置上报接口反向代理
        # /flow/* 以 ?secret=<节点 secret> 传递凭据，关闭 access_log（A8-01）。
        location /flow/upload {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_pass http://backend:6365/flow/upload;
        }

        location /flow/config {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
            proxy_pass http://backend:6365/flow/config;
        }

        # WebSocket代理 - system-info
        # 握手凭据在 query 中（?secret=<JWT 或节点 secret>），关闭 access_log（D2-01）。
        location /system-info {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_pass http://backend:6365/system-info;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $flmx_forwarded_proto;
        }
    }
} 
