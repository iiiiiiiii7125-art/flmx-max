events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # AUDIT-R1 (SCR-002): 备份恢复经 POST /api/v1/backup/import 上传整个 JSON，
    # 节点/订阅多时易超 1MB。nginx 默认 client_max_body_size 1m 会直接 413，
    # 请求到不了后端。放宽到 50m（面板为自托管内网服务）。
    client_max_body_size 50m;

    # gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # PWA 和 Service Worker 不缓存
        location ~* (sw\.js|service-worker\.js|workbox-.*\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # 带内容哈希的构建产物（/assets/，文件名形如 index-Bu9xQ2ab.js）：
        # 文件名变即内容变，可永久强缓存——immutable 让浏览器连验证都
        # 省了，发新版后新 index.html 引用新哈希名，旧文件自然淘汰。
        # 必须用 ^~ 前缀块：普通前缀块在选址顺序上输给下面的扩展名
        # 正则块，一年强缓存会落空。
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 其余静态文件（favicon、PWA 图标、logo、背景图等 public/ 直出
        # 文件，文件名无哈希）：内容变而文件名不变，绝不能 immutable
        # ——此前与哈希资源同块吃 30d immutable，换图标/背景图后用户
        # 一个月刷不出来。给 1 天适中缓存且不带 immutable：过期自动
        # 回源验证，普通刷新即可见新图。注意：再并用过期指令会发出
        # 两份 Cache-Control 头，此块只用 add_header 单头。
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=86400" always;
        }

        # HTML 文件不缓存
        location ~* \.(?:htm|html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        # Vue Router的history模式支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API代理到后端
        location = /api/v1/tunnel/diagnose/stream {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/tunnel/diagnose/stream;
        }

        location = /api/v1/forward/diagnose/stream {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/forward/diagnose/stream;
        }

        # sub_store 弃用窗口：GET 凭据在 URL 中，关闭该路径的 access_log
        #（R5-B2 D1；Sunset: Sun, 17 Jan 2027 00:00:00 GMT）
        location = /api/v1/open_api/sub_store {
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/open_api/sub_store;
        }

        location ^~ /api/v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://backend:6365/api/v1/;
        }

        # 流量与配置上报接口反向代理
        location /flow/upload {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:6365/flow/upload;
        }

        location /flow/config {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:6365/flow/config;
        }

        # WebSocket代理 - system-info
        location /system-info {
            proxy_pass http://backend:6365/system-info;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
} 
