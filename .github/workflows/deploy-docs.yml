name: Deploy Docs
on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - 'vite-frontend/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned (not ubuntu-latest), same reason as ci-build's frontend
    # job: the demo check below installs the Chromium pinned by
    # playwright-core 1.55.0, whose newest supported Ubuntu is 24.04;
    # a floating latest runner breaks the install (and with it this
    # gate) for environment reasons.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc/package-lock.json

      - name: Build
        working-directory: doc
        run: |
          npm ci
          npm run build

      # The online demo: the panel with recorded sample data and no backend
      # (vite-frontend/src/demo), served at /flmx-max/demo/. It must be
      # rebuilt into the same dist tree on every run: the deploy below is
      # force_orphan, so a skipped demo build would delete the demo.
      - name: Build demo
        working-directory: vite-frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g pnpm@10.28.1
          pnpm install --frozen-lockfile
          # F-L6-02: the demo footer must name the latest published release.
          # git describe only finds the nearest tag reachable from HEAD, so
          # it lags whenever the newest release tag is not an ancestor of
          # the checked-out commit; ask the Releases API instead and fall
          # back to git describe only if the API is unreachable.
          APP_VERSION="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "null" ]; then
            APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          fi
          VITE_DEMO=true VITE_BASE=/flmx-max/demo/ \
          VITE_APP_VERSION="$APP_VERSION" \
          VITE_GITHUB_REPO="https://github.com/${{ github.repository }}" \
            pnpm exec vite build --outDir ../doc/.vitepress/dist/demo --emptyOutDir

      # R2-C4-03: gate the publish on the same demo check ci-build
      # runs. Previously the check existed only in ci-build, which
      # runs parallel to this workflow with no dependency — a broken
      # demo (page errors, unrecorded API calls) could reach the
      # public site on a direct push to main while ci-build was red.
      # Same pinned browser and same check entry as ci-build's
      # frontend job; a failure here skips the Deploy step.
      - name: Install pinned Chromium for demo check
        working-directory: vite-frontend
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Check online demo before deploy
        working-directory: vite-frontend
        run: |
          CHROME="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")" node scripts/demo/check.mjs ../doc/.vitepress/dist/demo

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/.vitepress/dist
          force_orphan: true
