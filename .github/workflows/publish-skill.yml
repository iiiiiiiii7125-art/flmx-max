name: Publish Skill to npm

on:
  push:
    tags:
      # AUDIT-R1 (SCR-001): 与仓库纯数字 tag 发版惯例对齐（docker-build.yml 用 '[0-9]*'）。
      # 原 'v*' 触发器下该 workflow 永远不运行，skill 自动发布链死亡。
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # F-119: Node 版本统一为 22（与出厂 Dockerfile、deploy-docs、
          # ci-build 对齐）。
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./skills/flmx-api/package.json').version")
          else
            # AUDIT-R1 (SCR-001): 纯数字 tag（如 1.0.2）没有 v 前缀，
            # 原 "${GITHUB_REF#refs/tags/v}" 剥不掉前缀，会得到完整 ref。
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing skill version: $VERSION"

      - name: Sync package.json version with tag
        # AUDIT-R1 (SCR-001): 原流程算出 version 却从不写回 package.json，
        # npm publish 发布的是写死的版本号，与 tag 脱钩。
        working-directory: skills/flmx-api
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: skills/flmx-api
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          name: Skill ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: skills/flmx-api/package.json
