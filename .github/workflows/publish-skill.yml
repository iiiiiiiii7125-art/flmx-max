name: Publish Skill to npm

on:
  push:
    tags:
      # AUDIT-R1 (SCR-001): 与仓库纯数字 tag 发版惯例对齐（docker-build.yml 用 '[0-9]*'）。
      # 原 'v*' 触发器下该 workflow 永远不运行，skill 自动发布链死亡。
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # F-119: Node 版本统一为 22（与出厂 Dockerfile、deploy-docs、
          # ci-build 对齐）。
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./skills/flmx-api/package.json').version")
          else
            # AUDIT-R1 (SCR-001): 纯数字 tag（如 1.0.2）没有 v 前缀，
            # 原 "${GITHUB_REF#refs/tags/v}" 剥不掉前缀，会得到完整 ref。
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing skill version: $VERSION"

      - name: Assert package.json version matches the release tag
        # R2-C4-01: 三处版本字面量（skills/flmx-api/SKILL.md、
        # skills/flmx-api/package.json、doc/ai-skill.md 示例）由发版
        # 提交人工统一 bump，check-doc-consistency 只验三者彼此一致、
        # 不验与 tag 的关系。此前漏 bump 时旧版 package.json 会被下
        # 一步 npm version 静默抬到 tag 发布，而 SKILL.md 仍停在旧
        # 版，全程无红。这里在任何改写之前断言仓库内 package.json
        # 已与 tag 对齐，不齐即红、绝不发布。workflow_dispatch 无
        # tag、版本本就取自 package.json，断言恒真，故跳过。
        if: github.event_name != 'workflow_dispatch'
        working-directory: skills/flmx-api
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::skills/flmx-api/package.json version ($PKG_VERSION) does not match the release tag (${{ steps.version.outputs.version }}); bump the three skill version literals in the release commit first"
            exit 1
          fi

      - name: Sync package.json version with tag
        # AUDIT-R1 (SCR-001): 原流程算出 version 却从不写回 package.json，
        # npm publish 发布的是写死的版本号，与 tag 脱钩。
        working-directory: skills/flmx-api
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: skills/flmx-api
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # X-P3-33 (J-S3): 本 workflow 不创建 GitHub Release——Release
      # 由 docker-build.yml 唯一创建。此前 npm 步之后还有一步对同一
      # tag 的 Create GitHub Release，仅因 npm 步恒失败被
      # if: success() 跳过而未暴露；npm 步一旦转绿便会与正式
      # Release 冲突/覆盖，故已删除该步。
