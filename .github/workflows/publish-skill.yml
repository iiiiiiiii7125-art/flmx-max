name: Publish Skill to npm

on:
  # R3-C4-03: the former tag-push trigger (AUDIT-R1 SCR-001) ran in
  # parallel with docker-build with no ordering between them, so npm
  # could publish a skill for a release that verify later blocked —
  # in the 1.9.6 first run only the missing NPM_TOKEN (ENEEDAUTH)
  # accidentally prevented that. Publishing is now chained off the
  # release build: workflow_run fires only after "Build and Push
  # Images" completes, and the job below requires conclusion ==
  # 'success', so a blocked or failed release never reaches npm.
  # Only tag-push runs are chained: their head_branch is the version
  # tag itself. A manually dispatched docker-build carries its
  # version as an input rather than a ref, so there is no version to
  # read off the run; publishing for such a release stays a manual
  # workflow_dispatch here, as before.
  workflow_run:
    workflows:
      - Build and Push Images
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    # R3-C4-03: under workflow_run, publish only when the release
    # build succeeded end to end (verify + builds + create-release)
    # and was a tag push, whose head_branch names the version.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      # R4-C4-02: contents: write was idle — no step writes repo
      # content (checkout reads; npm publish uses NPM_TOKEN +
      # id-token provenance; this workflow creates no Release).
      # Converged to read, matching docker-build's per-job F-125
      # least-privilege posture.
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # R3-C4-03: pin the tree explicitly. Under workflow_run the
          # default checkout would be the default branch, which may
          # differ from the released tree (in 1.9.6 the tag was moved
          # and re-pushed mid-release: b6e4ca2e -> 08984f66). Publish
          # exactly the commit the successful release build ran on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # F-119: Node 版本统一为 22（与出厂 Dockerfile、deploy-docs、
          # ci-build 对齐）。
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./skills/flmx-api/package.json').version")
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # R3-C4-03: no tag ref exists on this event; for the
            # tag-push release build chained above, head_branch is
            # the version tag itself (e.g. 1.9.6).
            VERSION="${{ github.event.workflow_run.head_branch }}"
          fi
          # R4-C4-03: the former else branch (strip the version from
          # GITHUB_REF, AUDIT-R1 SCR-001) served the tag-push trigger
          # that R3-C4-03 removed; the current trigger set is only
          # workflow_run and workflow_dispatch, both covered above,
          # so the else was unreachable and has been deleted.
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing skill version: $VERSION"

      - name: Assert package.json version matches the release tag
        # R2-C4-01: 三处版本字面量（skills/flmx-api/SKILL.md、
        # skills/flmx-api/package.json、doc/ai-skill.md 示例）由发版
        # 提交人工统一 bump，check-doc-consistency 只验三者彼此一致、
        # 不验与 tag 的关系。此前漏 bump 时旧版 package.json 会被下
        # 一步 npm version 静默抬到 tag 发布，而 SKILL.md 仍停在旧
        # 版，全程无红。这里在任何改写之前断言仓库内 package.json
        # 已与 tag 对齐，不齐即红、绝不发布。workflow_dispatch 无
        # tag、版本本就取自 package.json，断言恒真，故跳过。
        # R3-C4-03: workflow_run 的版本取自发版 run 的 head_branch
        # （即 tag），同样在本断言覆盖内，且检出的树已钉在该
        # run 的 head_sha 上。
        if: github.event_name != 'workflow_dispatch'
        working-directory: skills/flmx-api
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::skills/flmx-api/package.json version ($PKG_VERSION) does not match the release tag (${{ steps.version.outputs.version }}); bump the three skill version literals in the release commit first"
            exit 1
          fi

      - name: Sync package.json version with tag
        # AUDIT-R1 (SCR-001): 原流程算出 version 却从不写回 package.json，
        # npm publish 发布的是写死的版本号，与 tag 脱钩。
        working-directory: skills/flmx-api
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: skills/flmx-api
        run: |
          # RR-C4-01: npm's default dist-tag is "latest", and a bare
          # `npm publish` of a prerelease version (e.g. 1.9.7-beta)
          # would move "latest" onto the beta — the npm face of the
          # R3-C4-04 family (GHCR :latest and the GitHub Release
          # prerelease flag are already guarded). Apply the exact
          # test docker-build's check-version uses for push_latest
          # (same regex as create-release's J-02 guard): only a
          # plain dotted-numeric version may take "latest"; anything
          # prerelease-shaped publishes under the "beta" dist-tag
          # instead, so the beta stays installable for testing
          # (npm i <pkg>@beta) without ever reaching default
          # installs. Skipping the publish entirely was the other
          # option; publishing under beta is chosen so prerelease
          # skills remain testable, mirroring how GHCR still pushes
          # the versioned image tag for prereleases.
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag beta
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # X-P3-33 (J-S3): 本 workflow 不创建 GitHub Release——Release
      # 由 docker-build.yml 唯一创建。此前 npm 步之后还有一步对同一
      # tag 的 Create GitHub Release，仅因 npm 步恒失败被
      # if: success() 跳过而未暴露；npm 步一旦转绿便会与正式
      # Release 冲突/覆盖，故已删除该步。
