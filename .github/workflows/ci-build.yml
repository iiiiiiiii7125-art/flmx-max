name: CI Build Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # C4-02: docker-build.yml (tag / workflow_dispatch release path) calls
  # this workflow as its pre-build verify job, so a release build runs
  # the identical gate/test suite defined below instead of relying on
  # the out-of-repo convention that tags are only cut from CI-green
  # branch tips. Adding workflow_call does not change push/PR runs.
  workflow_call:

# A4-06: every other workflow in this repo converged on explicit
# least-privilege token permissions; ci-build was the exception and
# it is the workflow that most executes repo content (pnpm install
# lifecycle scripts, go test, pip install, repo check scripts) on
# push and pull_request. No job here writes repo content (all steps
# are checkout/build/test/check only), so the top-level grant is
# read-only; a future job that needs more must declare it per-job.
permissions:
  contents: read

jobs:
  install-scripts:
    name: Test Installer Scripts (systemd and Alpine OpenRC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run installer regression tests
        run: bash test-install-scripts-proxy.sh

      - name: Test Alpine bootstrap and OpenRC lifecycle
        run: docker run --rm -v "$PWD:/workspace:ro" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f sh /workspace/test-install-scripts-alpine.sh

  frontend:
    name: Build Frontend
    # Pinned (not ubuntu-latest): the demo check installs Chromium with the
    # pinned playwright-core 1.55.0, whose newest supported Ubuntu is
    # 24.04; floating latest drifted to 26.04 and the install hard-fails.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # F-119: Node 版本统一为 22（与出厂 Dockerfile node:22-alpine、
          # deploy-docs 对齐；package.json engines 亦标注 >=22）。
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check contract fields
        working-directory: ${{ github.workspace }}
        run: node scripts/check-contract-fields.mjs

      # R4-C4-01: the full-SHA pinning discipline for workflow
      # actions was enforced by hand only; this gate censuses every
      # uses: across all workflows and fails on any mutable ref.
      - name: Check workflow action pins
        working-directory: ${{ github.workspace }}
        run: node scripts/check-workflow-pins.mjs

      # R5X-007: the doc/skill consistency gate must run in CI, not only
      # by hand at release time — an unwired gate let the
      # /api/v1/node/traffic/month skill gap survive two releases.
      - name: Check doc consistency
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-doc-consistency.sh

      # AG-03: the agent image tool set is an exec dependency of the
      # container form; dropping a package stays green everywhere
      # else and only breaks on real machines. Gate + mutation
      # selftest, mirroring the check-private-ranges pair.
      - name: Check agent image tools
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/check-agent-image-tools.sh
          bash scripts/check-agent-image-tools-selftest.sh

      - name: Build
        run: pnpm run build

      # R10X-016 (J-REG-01): the demo-check browser is pinned, never the
      # runner image's floating system Chrome — newer Chrome (152) LNA
      # checks fail every page (environment, not a regression; see
      # scripts/demo/README.md 「CI 检查」判读注记). playwright-core
      # 1.55.0 is a vite-frontend devDependency (pnpm-lock locked) and
      # pins Chromium revision 1187 (Chromium 140.0.7339.16).
      - name: Install pinned Chromium for demo check
        run: pnpm exec playwright-core install --with-deps chromium

      # The online demo answers the API from a recording: fail when a page
      # breaks or asks for something that was never recorded.
      # CHROME is injected with the pinned Chromium path resolved from
      # playwright-core 1.55.0 (chromium-1187); check.mjs is unchanged.
      - name: Check online demo
        run: |
          VITE_DEMO=true VITE_BASE=/flmx-max/demo/ pnpm exec vite build --outDir dist-demo
          CHROME="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")" node scripts/demo/check.mjs dist-demo

  # BG-01 (R2-026): the timeout-budgets and private-ranges gates run in
  # CI via check-doc-consistency.sh, but their mutation selftests were
  # referenced only by the parent gates' comments — no execution point,
  # so a gate that lost its teeth would fail silently. Wire both
  # selftests here as direct runs, mirroring the agent-image pair in the
  # frontend job. A dedicated job keeps the ~160s timeout-budgets
  # selftest off the frontend job's critical path (it runs in parallel).
  # The private-ranges script needs only bash + python3, but the
  # timeout-budgets gate extracts frontend values with the TypeScript
  # compiler API (scripts/timeout-fe-extract.mjs) and fails closed
  # (exit 2) when typescript is unresolvable. Resolution is confined
  # to the current worktree (the audited root's or this checkout's
  # vite-frontend/node_modules); an external copy counts only when
  # FLMX_CHECK_TYPESCRIPT names it explicitly (with a NOTE). This
  # job therefore installs the vite-frontend dependencies (typescript
  # lands in this checkout's vite-frontend/node_modules) before
  # running the selftests.
  gate-selftests:
    name: Gate Mutation Selftests (timeout budgets + private ranges)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.1

      - name: Install vite-frontend dependencies (typescript for the timeout gate)
        working-directory: vite-frontend
        run: pnpm install --frozen-lockfile

      - name: Run gate mutation selftests
        run: |
          bash scripts/check-private-ranges-selftest.sh
          bash scripts/check-timeout-budgets-selftest.sh

      # A4-02: the remaining five root gates (workflow-pins,
      # contract-fields, doc-consistency, script-version-bump,
      # doc-anchors) had no mutation selftest at all — a gate that
      # lost its teeth (extraction drift, vacuous PASS) was itself
      # undetectable. Each selftest mirrors its gate's read surface,
      # requires an unmutated PASS, then requires named FAILs on
      # planted drift. contract-fields/doc-consistency resolve
      # typescript from this checkout's vite-frontend/node_modules
      # (installed above); doc-consistency's go-dependent items use
      # the runner image's preinstalled Go.
      - name: Run remaining gate mutation selftests (A4-02)
        run: |
          bash scripts/check-workflow-pins-selftest.sh
          bash scripts/check-contract-fields-selftest.sh
          bash scripts/check-doc-consistency-selftest.sh
          bash scripts/check-script-version-bump-selftest.sh
          bash scripts/check-doc-anchors-selftest.sh

      # XC4-B2: the legacy-repo dual-push cutoff decision now lives
      # in scripts/dual-push-legacy.sh (extracted from docker-build.yml
      # inline bash, where no local check could catch it breaking);
      # its selftest pins the boundary grid and the workflow wiring.
      - name: Run dual-push decision selftest (XC4-B2)
        run: bash scripts/dual-push-legacy-selftest.sh

  backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

  backend-postgres-contract:
    name: Go Backend PostgreSQL Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        # A4-07: the contract suite must validate the PostgreSQL
        # major users actually deploy — the shipped compose files
        # (docker-compose-v4/v6.yml) pin postgres:16-alpine, while
        # this service floated on postgres:17, so PG16-only failures
        # (and PG17-only features silently relied on) passed CI.
        # Digest-pinned per A4-03 and guarded by the workflow-pins
        # container census (workflow image: surface, R2-01-03);
        # same digest as the compose files.
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: flux_test
          POSTGRES_PASSWORD: flux_test_pass
          POSTGRES_DB: flux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux_test -d flux_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL contract test
        env:
          FLMX_POSTGRES_TEST_DSN: 'postgres://flux_test:flux_test_pass@127.0.0.1:5432/flux_test?sslmode=disable'
        run: go test ./tests/contract -run 'TestPostgres' -count=1 -v -timeout 30m

  agent:
    name: Build Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-gost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: go-gost/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

  # F-008：全量 go test 门禁。此前 CI 只有 build + 单条 PG 契约用例，
  # B0 盘点的 10 个基线失败长期无人拦。纳入 go-backend 与 go-gost 两
  # 个模块。
  # X02-004（审计闭环 Round 1 / C17）：go-gost/x 不再整模块排除，现以
  # -short 全量纳入本 job；宿主机
  # 依赖的实机校验腿已在用例内自带能力探测门（TestNftScriptPortHopping
  # 的 fib 探测 F-091、TestNftScriptWhitelist 的 nft -c 可用性探测），
  # 环境不支持时只跳实机腿、脚本内容断言照常执行。FLMX 自研包必测
  # 清单（不得再被排除）：x/socket、x/kernel、x/bypass、x/service、
  # x/chain、x/config(+loader/parsing)。已知覆盖缺口登记：其余
  # 包无任何测试文件（继承上游的协议处理面包），属已知缺口、非本 job
  # 引入，新增 FLMX 改动落到无测试包时须同步补测试。包总数与带测试
  # 包数不在散文里写死（AG-01：此处散文计数曾与实数漂移、而同文件
  # 的标记计数安然无恙），一律以下行 K11-COUNT 标记为唯一声称源。
  # [K11-COUNT:x-tested=66] [K11-COUNT:x-untested=143] 上行包计数由
  # scripts/check-doc-consistency.sh 第 10 项以 go list 机械对账
  # （R3-K11 / X02-002），增减包或测试文件须同步更新数字与标记。
  # 已知状态（B7 落地时）：fix 分支基线不含 B4，go-backend 全量测试含
  # B0 已确认的 2 个 F-003 确定性失败，本 job 在 B4 合入 main 前会红、
  # 合入后转绿——属预期，不是本 job 引入的回归。
  # X02-001（R3-K11）：三腿统一显式 -timeout 30m，与本仓本地长测试
  # 纪律对齐。此前裸 go test 靠单包默认 600s 上限，而 go-backend 的
  # internal/http/handler 包串行基线已达 568s（默认上限的 94%）且逐轮
  # 增长，逼近上限触发的超时假 FAIL 形态为裸 FAIL、易误判成回归。
  # 水位线（预警口径）：handler 包串行基线 >480s（默认上限的 80%）
  # 即视为逼近预警——新增大用例前先评估拆包/并行化，不得再靠抬高
  # 超时续命；本节三腿的 -timeout 只许在基线复核后随本注释同步调整。
  backend-tests:
    name: Go Full Tests (backend + agent + x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go-backend/go.sum
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Backend full tests
        working-directory: go-backend
        run: go test -timeout 30m ./...

      - name: Agent full tests
        working-directory: go-gost
        run: go test -timeout 30m ./...

      - name: Agent x module tests
        working-directory: go-gost/x
        run: go test -short -timeout 30m ./...

  # X02-002（审计闭环 Round 1 / C17）：tests/e2e 此前无任何 CI 接入，
  # 且默认账号与后端 seed 不一致（admin_user 不是用户名、必然登录失败），
  # 整套 42 条用例实际零回归保护。本 job 跑 API 子集（-m api，不起
  # 浏览器）：构建真后端、以临时 DB 启动，再跑 pytest。conftest 在
  # 服务缺席时硬失败（仅显式 E2E_SKIP_OK 才跳过并汇总提示），本 job
  # 不设 E2E_SKIP_OK，杜绝全量 skip 假绿。浏览器子集（-m e2e）需前端
  # 构建与浏览器下载，暂未纳入，属已知缺口登记。
  e2e-api:
    name: E2E API Subset (pytest -m api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Build backend
        working-directory: go-backend
        run: go build -o /tmp/paneld ./cmd/paneld

      - name: Start backend
        run: |
          SERVER_ADDR=:6365 JWT_SECRET=test-secret-e2e-key-do-not-use-in-production FLMX_ADMIN_PASSWORD=E2eSeed!2026x DB_PATH=/tmp/e2e-panel.db /tmp/paneld > /tmp/paneld.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:6365/; then
              echo "backend up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -s -o /dev/null http://localhost:6365/ || (cat /tmp/paneld.log && exit 1)

      - name: Setup Python
        # R4-C4-01: full-SHA pin like every other uses: in the repo
        # (the v5 moving tag was the lone exception). a26af69 is the
        # commit the v5 tag currently points at (v5.6.0).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install e2e dependencies
        # A4-08: install from the committed lock (exact pins for the
        # full dependency set incl. transitives, resolved for Python
        # 3.11), then the project itself with --no-deps — the previous
        # bare `pip install "./tests/e2e[dev]"` resolved unbounded
        # >= ranges fresh on every run. Direct deps are also ==-pinned
        # in tests/e2e/pyproject.toml; keep both in sync per the
        # header of tests/e2e/requirements.lock.
        run: |
          pip install -r tests/e2e/requirements.lock
          pip install --no-deps "./tests/e2e[dev]"

      - name: Run API e2e subset
        working-directory: tests/e2e
        env:
          E2E_BACKEND_PORT: '6365'
          # FIX-CI-1: the seed password is random since 2.0.0; the
          # harness injects it through the product env var (same
          # value as the Start backend step) and the fixtures read it.
          FLMX_ADMIN_PASSWORD: 'E2eSeed!2026x'
        run: python -m pytest -m api
