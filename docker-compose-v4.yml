services:
  backend:
    image: ghcr.io/iiiiiiiii7125-art/flmx-flux-panel-backend:${FLUX_VERSION:-latest}
    container_name: ${PANEL_BACKEND_CONTAINER:-flux-panel-backend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: /app/data/gost.db
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      FLMX_WEBAUTHN_ORIGIN: ${FLMX_WEBAUTHN_ORIGIN:-${FLVX_WEBAUTHN_ORIGIN:-}}
      FLVX_WEBAUTHN_ORIGIN: ${FLVX_WEBAUTHN_ORIGIN:-}
      SERVER_ADDR: :6365
      # R6-L8-F-01: 本模板的默认拓扑是 Caddy → 前端 nginx → 后端，
      # 链上共两跳，可信代理跳数默认即 2（否则登录限流键会收敛到
      # 前端网关条目、全站共用一桶）。非标准拓扑（如反代直达后端
      # 端口、单跳）在 .env 里显式设置 FLMX_TRUSTED_PROXY_HOPS 覆盖。
      FLMX_TRUSTED_PROXY_HOPS: ${FLMX_TRUSTED_PROXY_HOPS:-2}
      TZ: Asia/Shanghai
      FLUX_VERSION: ${FLUX_VERSION:-dev}
      PANEL_DEPLOY_DIR: /opt/flmx-panel
      PANEL_BACKEND_CONTAINER: ${PANEL_BACKEND_CONTAINER:-flux-panel-backend}
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - sqlite_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/flmx-panel
    networks:
      - gost-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ${PANEL_POSTGRES_CONTAINER:-flux-panel-postgres}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_panel}
      POSTGRES_USER: ${POSTGRES_USER:-flux_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_panel_change_me}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flux_panel} -d ${POSTGRES_DB:-flux_panel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/iiiiiiiii7125-art/flmx-vite-frontend:${FLUX_VERSION:-latest}
    container_name: ${PANEL_FRONTEND_CONTAINER:-vite-frontend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    # F-124: 前端此前无 healthcheck，docker ps / 外部探活看不出 nginx
    # 是否在服务（后端与 PG 都有）。探针与 backend 同型（busybox wget）。
    # R1-01: 探针必须用 127.0.0.1 而非 localhost——容器内 localhost 先解析
    # 到 [::1]，BusyBox wget 失败后不回退 IPv4，而 nginx 只 listen 80
    # (IPv4)，用 localhost 时 healthcheck 恒失败、容器永久 unhealthy。
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - gost-network


volumes:
  sqlite_data:
    name: ${FLMX_SQLITE_VOLUME:-sqlite_data}
    driver: local
  postgres_data:
    name: ${FLMX_POSTGRES_VOLUME:-postgres_data}
    driver: local


networks:
  gost-network:
    name: ${FLMX_NETWORK:-gost-network}
    driver: bridge
    ipam:
      config:
        # R2-T02-01: 旧值 172.80.0.0/16 不在 RFC1918 私网段内（172.16.0.0/12
        # 之外，实为公网地址空间），后端 isTrustedProxyIP 不信任该网段来源，
        # 登录限流键坍缩为共享桶。新装改用私网段 172.30.0.0/16；存量部署
        # 不要改在用子网（会重建网络），其影响与处理见 doc/guide/install.md。
        - subnet: 172.30.0.0/16
